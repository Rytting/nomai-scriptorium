  {
    "celestial_body": "Dark Bramble",
    "location": "Escape Pod 3",
    "conversations": [
      {
        "recording": true,
        "spirals": [
          {
            "speaker": "SECCA",
            "text": "Our escape pod crashed as we tried to flee this place, destroying our movement and communication abilities in the process.",
            "parent": null,
            "zh": "塞卡：我们想要逃离这个地方，结果逃生舱坠毁了，我们丧失了移动和通讯能力。",
            "zh_source": "official",
            "zh_key": "SECCA: Our escape pod crashed as we tried to flee this place, destroying our movement and communication capabilities in the process."
          },
          {
            "speaker": "SECCA",
            "text": "We’ve held out for as long as we could here, but this pod’s supply of breathable air is nearly depleted, and the anglerfish attack more and more frequently.",
            "parent": 0,
            "zh": "塞卡：我们会在这里尽量坚持下去，不过逃生舱的空气补给即将耗尽，安康鱼的进攻也变得越来越频繁。",
            "zh_source": "official",
            "zh_key": "SECCA: We’ve held out as long as we could here, but this pod’s supply of breathable air is nearly depleted, and the anglerfish attack more and more frequently."
          },
          {
            "speaker": "SECCA",
            "text": "Our best chance at survival is to return to the Vessel to either repair the damage, or, more probably, await rescue.",
            "parent": 1,
            "zh": "塞卡：只有回到飞船那里，把它修好；或者更有可能是在那里等待救援，这样我们活下来的希望才最大。",
            "zh_source": "official",
            "zh_key": "SECCA: Our best chance at survival is to return to the Vessel to either repair the damage or, more probably, await rescue."
          },
          {
            "speaker": "ESCALL",
            "text": "Secca, is the message finished? The Vessel’s beacon is already growing fainter; it will be gone in a matter of hours. We need to leave here, quickly.",
            "parent": 2,
            "zh": "艾斯科尔：塞卡，消息结束了吗？飞船的信标已经开始减弱了，不出几个小时它就会消失。我们得尽快离开这里。",
            "zh_source": "official",
            "zh_key": "ESCALL: Secca, is the message finished? The Vessel’s beacon is already growing fainter; it will be gone in a matter of hours. We need to leave here, quickly."
          }
        ]
      },
      {
        "recording": true,
        "spirals": [
          {
            "speaker": "DIN",
            "text": "There is a new problem: our equipment is detecting two distinct beacons from the Vessel.",
            "parent": null,
            "zh": "迪恩：有一个新的问题：我们的设备在两个不同的地方检测到了飞船发出的信标。",
            "zh_source": "official",
            "zh_key": "DIN: There is a new problem: Our equipment is detecting two distinct beacons from the Vessel."
          },
          {
            "speaker": "SECCA",
            "text": "But it isn’t possible for the Vessel to be in two different locations at the same time.",
            "parent": 0,
            "zh": "塞卡：可是飞船不可能同时出现在两个地方啊。",
            "zh_source": "official",
            "zh_key": "SECCA: But it isn’t possible for the Vessel to be in two different locations at the same time."
          },
          {
            "speaker": "DIN",
            "text": "I agree, but the beacons are exactly identical to each other. Perhaps if I had more time-",
            "parent": 1,
            "zh": "迪恩：我同意，但这两个信标是完全相同的。也许再给我一点时间的话……",
            "zh_source": "official",
            "zh_key": "DIN: I agree, but the beacons are exactly identical to each other. Perhaps if I had more time —"
          },
          {
            "speaker": "SECCA",
            "text": "We’re nearly out of time already, Din; the Vessel’s beacon is quickly fading. Soon, it will be gone, and we will be lost.",
            "parent": 2,
            "zh": "塞卡：我们已经快没时间了，迪恩；飞船的信标正在迅速衰减。很快它就会消失，到时候我们就找不到路了。",
            "zh_source": "official",
            "zh_key": "SECCA: We’re nearly out of time already, Din; the Vessel’s beacon is quickly fading. Soon, it will be gone, and we will be lost."
          },
          {
            "speaker": "ESCALL",
            "text": "We will follow the beacon whose source is closest to us.",
            "parent": 3,
            "zh": "艾斯科尔：我们要跟着信标源最近的那个信标走。",
            "zh_source": "official",
            "zh_key": "ESCALL: We will follow the beacon whose source is nearest to us."
          },
          {
            "speaker": "DIN",
            "text": "But suppose that beacon is false!",
            "parent": 4,
            "zh": "迪恩：但万一那个信标是假的呢！",
            "zh_source": "official",
            "zh_key": "DIN: But suppose that beacon is false!"
          },
          {
            "speaker": "ESCALL",
            "text": "We likely don’t have enough air to reach the farther of the two beacons, Din. The decision is made for us.",
            "parent": 5,
            "zh": "艾斯科尔：我们不大可能有足够的空气去寻找比较远的那个信标，迪恩。我们别无选择。",
            "zh_source": "official",
            "zh_key": "ESCALL: We likely don’t have enough air to reach the farther of the two beacons, Din. The decision is made for us."
          },
          {
            "speaker": "ESCALL",
            "text": "We’ll leave a trail of lights as we go. There’s still a chance someone could hear our escape pod’s distress signal.",
            "parent": 6,
            "zh": "艾斯科尔：我们一边走一边在路上留下发光路标。别人依然有可能会收到我们的逃生舱发出来的信号。",
            "zh_source": "official",
            "zh_key": "ESCALL: We’ll leave a trail of lights as we go. There’s still a chance someone could hear our escape pod’s distress signal."
          }
        ]
      },
      {
        "recording": true,
        "spirals": [
          {
            "speaker": "SECCA",
            "text": "To any who come here searching for us: we followed one of the two beacons from the Vessel to this place, but now can go no further.",
            "parent": null,
            "zh": "塞卡：给来找我们的人：我们跟着飞船发出的两个信标之一来到了这个地方，但现在我们没法继续前进了。",
            "zh_source": "official",
            "zh_key": "SECCA: To any who come here searching for us: We followed one of the two beacons from the Vessel to this place, but now can go no further."
          },
          {
            "speaker": "SECCA",
            "text": "It’s almost too faint to hear now, but the Vessel’s beacon is still faintly emitting from within this thorny seed. Yet the opening is too small for a single Nomai to fit through, so our escape pod couldn’t have flown through here.",
            "parent": 0,
            "zh": "塞卡：信号现在已经快接收不到了，但是飞船的信标还在从这个带刺的种子里向外进行微弱的发射。开口太小，就连一个挪麦人都钻不过去，所以我们的逃生舱没办法飞进去。",
            "zh_source": "official",
            "zh_key": "SECCA: It’s almost too faint to hear now, but the Vessel’s beacon is still faintly emitting from within this thorny seed. Yet the opening is too small for even a single Nomai to fit through it, so our escape pod couldn’t have flown through here."
          },
          {
            "speaker": "SECCA",
            "text": "I don’t understand how this could be possible, but this gruesome place seems able to manipulate space itself; maybe this was our undoing.",
            "parent": 1,
            "zh": "塞卡：我不明白这怎么可能，不过这个可怕的地方貌似能够操控空间；也许这就是我们末日。",
            "zh_source": "official",
            "zh_key": "SECCA: I don’t understand how this could be possible, but this gruesome place seems able to manipulate space itself; maybe this was our undoing."
          },
          {
            "speaker": "SECCA",
            "text": "To be so close to the location of the Vessel and still so far is… difficult. Worse, the Vessel’s beacon is dying; soon, we will be unable to hear it.",
            "parent": 2,
            "zh": "塞卡：飞船的位置就在眼前，可要找到它却……如此困难。更糟糕的是，飞船的信标正在衰减；很快我们就要接收不到信号了。",
            "zh_source": "official",
            "zh_key": "SECCA: To be so close to the location of the Vessel and still so far is... difficult. Worse, the Vessel’s beacon is dying; soon, we will be unable to hear it."
          },
          {
            "speaker": "SECCA",
            "text": "There is nothing we can do now but try to perhaps find a way inside, or at least attempt to comprehend why this happened.",
            "parent": 3,
            "zh": "塞卡：现在我们什么都做不了，只能试着看看能不能想办法进去，或者至少弄清楚为什么会发生这样的事情。",
            "zh_source": "official",
            "zh_key": "SECCA: There is nothing we can do now but try to perhaps find a way inside, or at least attempt to comprehend why this happened."
          },
          {
            "speaker": "SECCA",
            "text": "My dearest hope is that the other escape pods were able to reach relative safety.",
            "parent": 4,
            "zh": "塞卡：我最大的愿望就是其它逃生舱落到了相对安全的地方。",
            "zh_source": "official",
            "zh_key": "SECCA: My dearest hope is that the other escape pods were able to reach relative safety."
          }
        ]
      }
    ]
  },
  {
    "celestial_body": "Dark Bramble",
    "location": "The Vessel",
    "conversations": [
      {
        "recording": true,
        "spirals": [
          {
            "speaker": "FILIX",
            "text": "I’m recording now - I’ve never encountered anything like this! The signal the Vessel is receiving seems to be *older than the universe itself*!",
            "parent": null,
            "zh": "费利克斯：我正在做记录，我从没见过这样的事情！飞船收到的信号貌似比宇宙本身还要古老！",
            "zh_source": "official",
            "zh_key": "FILIX: I’m recording now — I’ve never encountered anything like this! The signal the Vessel is receiving appears to be <i>older than the universe itself</i>!"
          },
          {
            "speaker": "ESCALL",
            "text": "This is our first contact with anything of this nature. Everyone, prepare to warp immediately!",
            "parent": 0,
            "zh": "艾斯科尔：这是我们第一次接触到这种情况。所有人，准备立刻跃迁！",
            "zh_source": "official",
            "zh_key": "ESCALL: This is our first contact with anything of this nature. Everyone, prepare to warp immediately!"
          },
          {
            "speaker": "FILIX",
            "text": "Escall, wait! I need more time to send an outgoing message! Shouldn’t we tell another clan where we’re going?",
            "parent": 1,
            "zh": "费利克斯：艾斯科尔，等等，我需要一点时间来向外发送消息！难道我们不该把自己的目的地告诉其他家族吗？",
            "zh_source": "official",
            "zh_key": "FILIX: Escall, wait, I need more time to send an outgoing message! Shouldn’t we tell another clan where we’re going?"
          },
          {
            "speaker": "ESCALL",
            "text": "We can send the message on arrival. This extraordinary signal appeared suddenly; it may disappear just as quickly, and we can’t lose a discovery this incredible! Focus on preparing for the warp, instead.",
            "parent": 2,
            "zh": "艾斯科尔：消息可以在我们抵达后再发。这个非同寻常的信号是突然出现的；它可能也会瞬间消失，我们不能失去如此重大的发现！还是集中精神为跃迁做好准备吧。",
            "zh_source": "official",
            "zh_key": "ESCALL: We can send the message upon our arrival. This extraordinary signal appeared suddenly; it may disappear just as quickly, and we can’t lose a discovery this incredible! Focus on preparing for the warp, instead."
          },
          {
            "speaker": "FILIX",
            "text": "I understand!",
            "parent": 3,
            "zh": "费利克斯：我明白了！",
            "zh_source": "official",
            "zh_key": "FILIX: I understand!"
          },
          {
            "speaker": "ESCALL",
            "text": "Annona, is the Vessel ready to warp to the signal’s approximate coordinates?",
            "parent": 4,
            "zh": "艾斯科尔：安诺纳，飞船准备好跃迁到信号的大致坐标上了吗？",
            "zh_source": "official",
            "zh_key": "ESCALL: Annona, is the Vessel ready to warp to the signal’s approximate coordinates?"
          },
          {
            "speaker": "ANNONA",
            "text": "The warp core is powered, but this will be a significant jump. Afterward, we’ll need time to recharge the core.",
            "parent": 5,
            "zh": "安诺纳：跃迁核心充能完毕，但这次跃迁的距离十分遥远。我们之后需要花时间为核心重新充能。",
            "zh_source": "official",
            "zh_key": "ANNONA: The warp core is powered, but this will be a significant jump. Afterward, we’ll need time to recharge the core."
          },
          {
            "speaker": "ESCALL",
            "text": "That shouldn’t create a problem, provided we arrive at or near the signal’s source. Everyone, we’re ready to warp!",
            "parent": 6,
            "zh": "艾斯科尔：只要我们能够抵达信号源的位置或是附近，那就应该不成问题。所有人，我们准备跃迁！",
            "zh_source": "official",
            "zh_key": "ESCALL: That shouldn’t create a problem, provided we arrive at or near the signal’s source. Everyone, we’re ready to warp!"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "FILIX",
            "text": "This is Escall’s Vessel; something went badly wrong during our warp, and our Vessel is mortally wounded. We need help as quickly as possible!",
            "parent": null,
            "zh": "费利克斯：这里是艾斯科尔的飞船；我们的跃迁出了大问题，我们的飞船遭受严重损伤。我们需要尽快得到帮助！",
            "zh_source": "official",
            "zh_key": "FILIX: This is Escall’s Vessel; something went badly wrong during our warp, and our Vessel is mortally wounded. We need help as quickly as possible!"
          },
          {
            "speaker": "FILIX",
            "text": "Our Vessel appears to have… has it *fused* with the local environment, somehow? There are vines that are now part of the Vessel! It’s been torn apart from inside itself!",
            "parent": 0,
            "zh": "费利克斯：我们的飞船好像……好像和当地环境融合在了一起？如今藤蔓也变成了飞船的一部分！它在内部拆卸自己！",
            "zh_source": "official",
            "zh_key": "FILIX: Our Vessel appears to have... has it <i>fused</i> with the local environment, somehow? There are vines that are now part of the Vessel! It’s been torn apart from inside itself!"
          },
          {
            "speaker": "FILIX",
            "text": "We… we are abandoning our Vessel. Any Nomai clans or spaceflight-capable species receiving, I implore you, we need your help!",
            "parent": 1,
            "zh": "费利克斯：我们……我们要放弃飞船了。收到这个消息的挪麦家族，或是具有太空航行能力的种族，我恳请你们，我们需要你们的帮助！",
            "zh_source": "official",
            "zh_key": "FILIX: We... we are abandoning our Vessel. Any Nomai clans or spaceflight-capable species receiving this message, I implore you, we need your help!"
          },
          {
            "speaker": "FILIX",
            "text": "Is this broken? Can anyone hear me? Our Vessel is dying! We need immediate assistance!",
            "parent": 2,
            "zh": "费利克斯：这东西坏了吗？有人能听见吗？我们的飞船正在死亡！我们急需援助！",
            "zh_source": "official",
            "zh_key": "FILIX: Is this broken? Can anyone hear me? Our Vessel is dying! We need immediate assistance!"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "CANNA",
            "text": "To any Nomai Clans whose Vessels can hear this message:",
            "parent": null,
            "zh": "卡纳：所有能够收到这个消息的挪麦家族飞船注意：",
            "zh_source": "official",
            "zh_key": "CANNA: To any Nomai clans whose Vessels can hear this message:"
          },
          {
            "speaker": "CANNA",
            "text": "It’s clear the universe is dying. There are fewer and fewer resources and safe places within space now, so my clan and I believe the best option is for all of our clans to stay together.",
            "parent": 0,
            "zh": "卡纳：很明显，这个宇宙正在死亡。太空里安全的地方越来越少，资源也是一样。因此我的家族和我认为，最好的办法就是让所有的家族都团结在一起。",
            "zh_source": "official",
            "zh_key": "CANNA: It’s clear the universe is dying. There are fewer and fewer resources and safe places within space now, so my clan and I believe the best option is for all of our clans to stay together."
          },
          {
            "speaker": "CANNA",
            "text": "If you can reach the Gloaming Galaxy, we’ve found that Blackrock’s suns are fairly stable, and life in this star system is (comparatively) thriving. We live in relative safety.",
            "parent": 1,
            "zh": "卡纳：如果你能够前往暮色银河那就最好，我们已经发现黑石星系的太阳比较稳定，这个星系的生命比较起来还算是繁荣。在这里生活，我们可以稍微安全一些。",
            "zh_source": "official",
            "zh_key": "CANNA: If you can reach the Gloaming Galaxy, we’ve found that Blackrock’s suns are fairly stable, and life in this star system is (comparatively) thriving. We live in relative safety."
          },
          {
            "speaker": "BROMI",
            "text": "Canna, we’re making our way to you.",
            "parent": 2,
            "zh": "布洛密：卡纳，我们正在朝你那里进发。",
            "zh_source": "official",
            "zh_key": "BROMI: Canna, we’re making our way to you."
          },
          {
            "speaker": "CANNA",
            "text": "Has anyone heard from Neem? His clan was on its way to our Vessel, but they never arrived, and he hasn’t sent any messages. I’m beginning to worry.",
            "parent": 3,
            "zh": "卡纳：有尼姆的消息？他的家族正在朝我们的飞船前进，但一直没能抵达。而且他也没有发来任何消息。我开始有点担心了。",
            "zh_source": "official",
            "zh_key": "CANNA: Has anyone heard from Neem? His clan was on its way to our Vessel, but they never arrived, and he hasn’t sent any messages. I’m beginning to worry."
          },
          {
            "speaker": "BROMI",
            "text": "That *is* unsettling. It reminds me of that old myth my grandfather used to tell, the Disappearance of Escall.",
            "parent": 4,
            "zh": "布洛密：那可真是不妙啊。我想起了祖父以前常常挂在嘴边的一个古老传说：艾斯科尔的失踪。",
            "zh_source": "official",
            "zh_key": "BROMI: That <i>is</i> unsettling. It reminds me of that old myth my grandfather used to tell, the Disappearance of Escall."
          },
          {
            "speaker": "CLEM",
            "text": "I remember hearing that story as a child! One day, Escall’s Vessel simply stopped responding. The other clans searched and searched, but found no trace. It was as if their missing friends had warped out of existence.",
            "parent": 5,
            "zh": "克莱姆：我记得小时候听过这个故事！有一天，艾斯科尔的飞船突然没了消息。其他家族找了又找，可是一无所获。仿佛他们的朋友们就这样彻底消失不见了。",
            "zh_source": "official",
            "zh_key": "CLEM: I remember hearing that story as a child! One day, Escall’s Vessel simply stopped responding. The other clans searched and searched, but found no trace. It was as if their missing friends had warped out of existence."
          },
          {
            "speaker": "HYSSOP",
            "text": "That’s no myth, friends: Escall’s clan existed, and their story was real.",
            "parent": 6,
            "zh": "希索普：那可不是什么传说，朋友们。艾斯科尔家族曾经存在过，他们的故事也是真的。",
            "zh_source": "official",
            "zh_key": "HYSSOP: That’s no myth, friends; Escall’s clan existed, and their story was real."
          },
          {
            "speaker": "BROMI",
            "text": "What a curious event to have passed into myth! Our ancestors’ ancestors were told that story when they were young. Are you sure it’s true, Hyssop?",
            "parent": 7,
            "zh": "布洛密：这样一个离奇的事件，怎么就成了传说呢！那是我们祖先的祖先在小时候听长辈说的故事。你确定这个事情是真的吗，希索普？",
            "zh_source": "official",
            "zh_key": "BROMI: What a curious event to have passed into myth! Our ancestors’ ancestors were told that story when they were young. Are you sure it’s true, Hyssop?"
          },
          {
            "speaker": "HYSSOP",
            "text": "It was a very long time ago, but yes. My clan’s ancestors searched for Escall’s clan for a long time, but in the end, none of them were ever seen again. (It’s the only time a Vessel has ever disappeared in this way.)",
            "parent": 8,
            "zh": "希索普：事情已经过去很久了。不过它的确是真的。我们家族的祖先花了很长时间来寻找艾斯科尔家族。但是到了最后，谁都没有再听说过他们的消息。（飞船以这种方式失踪，在我们的历史上这是唯一的一次。）",
            "zh_source": "official",
            "zh_key": "HYSSOP: It was a very long time ago, but yes. My clan’s ancestors searched for Escall’s clan for a long time, but in the end, none of them were ever seen again. (It’s the only time in our history a Vessel has ever disappeared this way.)"
          },
          {
            "speaker": "NEEM",
            "text": "Hyssop, I hope you aren’t comparing Escall’s story to my clan’s vessel!",
            "parent": 9,
            "zh": "尼姆：希索普，但愿你不是在拿艾斯科尔的故事和我们家族的飞船打比方！",
            "zh_source": "official",
            "zh_key": "NEEM: Hyssop, I hope you aren’t comparing Escall’s story to my clan’s Vessel!"
          },
          {
            "speaker": "CLEM",
            "text": "Neem, my friend! We feared you were gone!",
            "parent": 10,
            "zh": "克莱姆：尼姆，我的朋友！我们还担心你是不是失踪了呢！",
            "zh_source": "official",
            "zh_key": "CLEM: Neem, my friend! We feared you were gone!"
          },
          {
            "speaker": "NEEM",
            "text": "Not yet, we aren’t, but nearly. We found trouble during our warp: the triple suns of the Bright Spark star system exploded, and it was only a lucky coincidence we weren’t caught in the blast. We’ll meet you soon, Canna!",
            "parent": 11,
            "zh": "尼姆：这倒是没有，不过就差一点。我们在跃迁的时候遇到了麻烦：闪耀火花星系的三颗太阳爆发了。算我们走运，这才没被卷进去。我们待会儿见，卡纳！",
            "zh_source": "official",
            "zh_key": "NEEM: Not yet, we aren’t, but nearly. We found trouble during our warp: The triple suns of the Bright Spark star system exploded, and it was only a lucky coincidence we weren’t caught in the blast. We’ll meet you soon, Canna!"
          },
          {
            "speaker": "CANNA",
            "text": "I’m relieved your clan is safe, Neem! It’s good to hear your words. Any clan nearby, remember to be extremely cautious of potentially unstable stars (which is most of them, now).",
            "parent": 12,
            "zh": "卡纳：你的家族没事可真是太好了，尼姆！很高兴能够收到你的消息。附近所有的飞船，请多加小心可能出现的不稳定恒星。就目前而言，大部分恒星都不稳定。",
            "zh_source": "official",
            "zh_key": "CANNA: I’m relieved your clan is safe, Neem! It’s good to hear your words. Any Vessels nearby, remember to be extremely cautious of potentially unstable stars (which is most of them, now)."
          }
        ]
      }
    ]
  }
]
;

async function load(){
  if (CORPUS){
    DATA = CORPUS;
  } else {
    try {
      const r = await fetch("../docs/nomai_corpus.json");
      DATA = await r.json();
    } catch {
      $("main").innerHTML = '<p class="empty-note">Could not load nomai_corpus.json</p>';
      return;
    }
  }
  byBody = {};
  for (const loc of DATA){
    const b = loc.celestial_body || "Unknown";
    if (!byBody[b]) byBody[b] = [];
    byBody[b].push(loc);
  }
  routeFromHash();
  finishLibraryBoot();
}

/* ── Hash routing ───────────────────────────────────── */
function routeFromHash(){
  const old = capturePage();
  const p = new URLSearchParams(location.hash.slice(1));
  const body = p.get("body");
  const loc = p.get("loc");
  const ci = p.get("c");
  speakerFilter = p.get("speaker");
  if (body && loc != null){
    /* `c` was read and then dropped on the floor here too, which is why a reloaded or
       pasted link opened the location and selected nothing. Out-of-range survives as
       a number and simply matches no slot, which is the same as selecting nothing. */
    const n = ci == null || ci === "" ? NaN : Number(ci);
    view = { type:"location", body, location:loc,
             conv: Number.isInteger(n) && n >= 0 ? n : null };
  } else if (speakerFilter){
    view = { type:"speaker", speaker:speakerFilter };
  } else if (body){
    view = { type:"body", body };
  } else {
    view = { type:"map" };
  }
  render();
  enterPage(old);
}
function nav(v){
  const old = capturePage();
  speakerFilter = v.speaker || null;
  $("search").value = "";
  /* `conv` is the scroll the caller was pointing at -- a speaker's list knows which
     entry of a location its row stands for. It was being flattened to null one line
     after the caller worked it out, so arriving from a name always landed on the
     whole location with nothing selected, and which of the near-identical triangles
     was meant was left to be guessed. It goes into the hash as well, so the link
     carries the answer and can be shared or reloaded. */
  view = {...v, conv: v.conv == null ? null : v.conv};
  const p = new URLSearchParams();
  if (speakerFilter) p.set("speaker", speakerFilter);
  if (v.body) p.set("body", v.body);
  if (v.location != null) p.set("loc", v.location);
  if (view.conv != null) p.set("c", view.conv);
  const h = p.toString();
  history.pushState(null, "", h ? "#" + h : location.pathname);
  render();
  enterPage(old);
}
function capturePage(){
  document.querySelectorAll(".page-ghost").forEach(e => e.remove());
  if (matchMedia("(prefers-reduced-motion:reduce)").matches || !$("main").children.length) return null;
  const shell = document.querySelector(".shell"), r = shell.getBoundingClientRect();
  const old = shell.cloneNode(true);
  old.classList.add("page-ghost");old.inert = true;old.setAttribute("aria-hidden","true");
  old.removeAttribute("id");old.querySelectorAll("[id]").forEach(e => e.removeAttribute("id"));
  Object.assign(old.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px"});
  document.body.appendChild(old);
  return old;
}
function enterPage(old){
  const shell = document.querySelector(".shell");
  shell.getAnimations().forEach(a => a.cancel());
  $("main").classList.remove("tracking");
  window.scrollTo({top:0,behavior:"instant"});
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) { if(old)old.remove(); return; }
  if(old){
    const exit = old.animate([{transform:"scale(1)",opacity:1},{transform:"scale(1.16)",opacity:0,filter:"blur(3px)"}],
      {duration:220,easing:"ease-in",fill:"forwards"});
    exit.onfinish = () => old.remove();
  }
  shell.animate([
    {transform:"perspective(1100px) translateZ(-180px)",opacity:0,filter:"blur(2px) brightness(1.15)"},
    {transform:"perspective(1100px) translateZ(0)",opacity:1,filter:"blur(0) brightness(1)"}
  ],{duration:270,easing:"cubic-bezier(.16,.8,.28,1)"});
}
window.addEventListener("popstate", routeFromHash);

/* ── Render dispatch ────────────────────────────────── */
function render(){
  document.querySelector(".shell:not(.page-ghost) .back-link").textContent = "← " + t("Back to Scriptorium");
  $("page-title").textContent = view.type === "location" ? locName(view.location)
    : view.type === "body" ? bodyName(view.body)
    : view.type === "speaker" ? spkName(speakerFilter) : t("Nomai Repository");
  paintThemeKey();
  renderCrumb();
  const m = $("main");
  m.onpointermove = e => {
    if (e.pointerType === "touch") { m.classList.remove("tracking"); return; }
    const r = m.getBoundingClientRect();
    m.style.setProperty("--pointer-x", (e.clientX - r.left - m.clientLeft) + "px");
    m.style.setProperty("--pointer-y", (e.clientY - r.top - m.clientTop) + "px");
    m.classList.add("tracking");
  };
  m.onpointerleave = m.onpointercancel = m.onkeydown = () => m.classList.remove("tracking");
  const q = ($("search").value || "").trim().toLowerCase();
  if (q) { renderSearch(q); return; }
  if (view.type === "map" || view.type === "speaker") renderMap(m);
  else if (view.type === "body") renderBody(m);
  else if (view.type === "location") renderLocation(m);
}

/* ── Breadcrumb ─────────────────────────────────────── */
/* Escape is the same gesture without a mouse. Bound once, here, rather than inside a
   render -- listeners added per render stack up and fire once per render that ever
   happened. */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || view.type !== "location" || view.conv == null) return;
  view.conv = null;
  view.reading = false;
  render();
});

function renderCrumb(){
  const c = $("crumb");
  const home = view.type === "map";
  c.innerHTML = `<button class="log-key" id="nav-home" ${home ? "disabled" : ""}>${LANG === "zh" ? "回到主页面" : "Back to main page"}</button>`
    + `<button class="log-key" id="nav-up" ${home ? "disabled" : ""}>${LANG === "zh" ? "返回上一级" : "Back one level"}</button>`;
  $("nav-home").onclick = () => nav({type:"map"});
  $("nav-up").onclick = () => {
    if (view.type === "location") nav(speakerFilter ? {type:"speaker",speaker:speakerFilter} : {type:"body",body:view.body});
    else nav({type:"map"});
  };

}

/* ── Global speaker bar (all speakers across corpus) ── */
function buildGlobalSpeakers(){
  const sp = {};
  for (const loc of DATA)
    for (const conv of loc.conversations)
      for (const s of conv.spirals)
        if (s.speaker) sp[s.speaker] = (sp[s.speaker] || 0) + 1;
  return Object.keys(sp).sort((a, b) => sp[b] - sp[a]);
}
function renderSpeakerBar(speakers, container){
  let html = '<div class="speaker-field"><div class="speaker-bar" role="group" aria-label="' + (LANG === "zh" ? "按说话人筛选" : "Filter by speaker") + '">';
  for (const sp of speakers){
    const active = speakerFilter === sp ? " active" : "";
    html += `<button class="speaker-chip${active}" aria-pressed="${speakerFilter === sp}" data-speaker="${esc(sp)}">
      <svg width="24" height="23" aria-hidden="true"><use href="#nomai-mask"/></svg>
      <span class="sp-name">${esc(spkName(sp))}</span>
    </button>`;
  }
  html += '</div><span class="speaker-more left" aria-hidden="true" hidden>‹</span>'
    + '<span class="speaker-more right" aria-hidden="true" hidden>›</span></div>';
  return html;
}
function bindSpeakerChips(container, onToggle){
  const field = container.querySelector(".speaker-field");
  if (field){
    field.querySelector(".speaker-bar").onscroll = updateSpeakerEdges;
    requestAnimationFrame(updateSpeakerEdges);
  }
  container.querySelectorAll("[data-speaker]").forEach(el =>
    el.onclick = () => {
      nav({type:"speaker", speaker:el.dataset.speaker});
    });
}
function updateSpeakerEdges(){
  const field = document.querySelector(".speaker-field");
  if (!field) return;
  const bar = field.querySelector(".speaker-bar");
  field.querySelector(".left").hidden = bar.scrollLeft <= 1;
  field.querySelector(".right").hidden = bar.scrollLeft + bar.clientWidth >= bar.scrollWidth - 1;
}
window.addEventListener("resize", updateSpeakerEdges);

/* ── Map view ───────────────────────────────────────── */
function renderMap(m){
  const allSpeakers = buildGlobalSpeakers();
  let html = speakerFilter ? "" : renderSpeakerBar(allSpeakers, m);

  if (speakerFilter){
    /* speaker-first view: show all locations where this speaker appears, grouped by body */
    const hits = [];
    for (const loc of DATA)
      for (let ci = 0; ci < loc.conversations.length; ci++){
        const conv = loc.conversations[ci];
        if (conv.spirals.some(s => s.speaker === speakerFilter))
          hits.push({ loc, ci, conv });
      }
    html += `<p class="section-sub">${hits.length} ${t("conversations")}</p><div class="loc-list">`;
    for (const h of hits){
      html += `<button class="loc-row" data-body="${esc(h.loc.celestial_body)}" data-loc="${esc(h.loc.location)}" data-entry="${h.ci}">
        <span class="loc-marker" aria-hidden="true">▸</span>
        <span class="loc-name">${esc(locName(h.loc.location))} · ${convName(h.ci)}</span>
        <span class="loc-count">${esc(bodyName(h.loc.celestial_body))}</span>
      </button>`;
    }
    html += "</div>";
  } else {
    /* normal body grid */
    const bodies = Object.keys(byBody).sort((a, b) =>
      byBody[b].length - byBody[a].length);
    html += '<div class="body-grid">' + bodies.map(b => {
      const locs = byBody[b];
      const convs = locs.reduce((s, l) => s + l.conversations.length, 0);
      const grad = BODY_COLORS[b] || "linear-gradient(135deg,#555,#777)";
      return `<button class="body-card" data-body="${esc(b)}" style="--body-tint:${grad}">
        <span class="body-name">${esc(bodyName(b))}</span>
        <span class="body-art" aria-hidden="true"><span class="body-orb" style="background:${grad}"></span></span>
        <span class="body-sub">${locs.length} ${t("locations")} · ${convs} ${t("conversations")}</span>
      </button>`;
    }).join("") + "</div>";
  }

  m.innerHTML = html;
  bindSpeakerChips(m, () => renderMap(m));
  m.querySelectorAll("[data-body]:not([data-loc])").forEach(el =>
    el.onclick = () => nav({ type:"body", body:el.dataset.body }));
  m.querySelectorAll("[data-loc]").forEach(el =>
    el.onclick = () => nav({ type:"location", body:el.dataset.body, location:el.dataset.loc, conv:el.dataset.entry != null ? +el.dataset.entry : null, speaker:speakerFilter }));
}

/* ── Body view ──────────────────────────────────────── */
function renderBody(m){
  const locs = byBody[view.body] || [];

  /* collect speakers across all locations for this body */
  const spCounts = {};
  for (const loc of locs)
    for (const conv of loc.conversations)
      for (const sp of conv.spirals)
        if (sp.speaker) spCounts[sp.speaker] = (spCounts[sp.speaker] || 0) + 1;
  const speakers = Object.keys(spCounts).sort((a, b) => spCounts[b] - spCounts[a]);

  /* filter locations when a speaker is active */
  const filtered = speakerFilter
    ? locs.filter(loc => loc.conversations.some(c =>
        c.spirals.some(sp => sp.speaker === speakerFilter)))
    : locs;

  let html = "";
  html += `<p class="section-sub">${locs.length} ${t("locations")} · ` +
    `${locs.reduce((s, l) => s + l.conversations.length, 0)} ${t("conversations")}` +
    `${speakerFilter ? ` · ${LANG === "zh" ? "筛选" : "filter"}: ${spkName(speakerFilter)}` : ""}</p>`;

  /* speaker mask bar */
  if (speakers.length) html += renderSpeakerBar(speakers, m);

  html += '<div class="loc-list">';
  for (const loc of filtered){
    const n = speakerFilter
      ? loc.conversations.filter(c => c.spirals.some(sp => sp.speaker === speakerFilter)).length
      : loc.conversations.length;
    html += `<div class="loc-row" data-loc="${esc(loc.location)}">
      <span class="loc-marker">▸</span>
      <span class="loc-name">${esc(locName(loc.location))}</span>
      <span class="loc-count">${n}</span>
    </div>`;
  }
  html += "</div>";
  m.innerHTML = html;
  m.querySelectorAll("[data-loc]").forEach(el =>
    el.onclick = () => nav({ type:"location", body:view.body, location:el.dataset.loc }));
  bindSpeakerChips(m, () => renderBody(m));
}

/* ── Location view ──────────────────────────────────── */
function renderLocation(m){
  const loc = DATA.find(l => l.celestial_body === view.body && l.location === view.location);
  if (!loc){ m.innerHTML = '<p class="empty-note">Location not found</p>'; return; }
  const convs = loc.conversations;
  let html = "";
  html += `<p class="section-sub">${convs.length} ${t("conversations")}</p>`;

  html += '<div id="scroll-actions"></div>';
  /* scroll rack */
  const tri = r => [[0,1],[-.866,-.5],[.866,-.5]]
    .map(p => (p[0]*r).toFixed(1)+","+(p[1]*r).toFixed(1)).join(" ");
  html += '<div class="rack">';
  for (let ci = 0; ci < convs.length; ci++){
    const c = convs[ci];
    const speakers = [...new Set(c.spirals.map(s => s.speaker).filter(Boolean))];
    const label = speakers.map(spkName).join(LANG === "zh" ? "、" : ", ");
    const tag = c.recording ? "🎥" : c.projection_stone ? "🔗" : c.question_pair ? "❓" : "";
    /* Lit while the scroll is the one being pointed at; not once it is open. The
       highlight exists to answer "which of these did I come for", and the thread
       underneath, titled with the same number, answers it better from then on. The
       button is still the pressed one, so aria-pressed keeps saying so. */
    const active = view.conv === ci && !view.reading ? " active" : "";
    html += `<button class="scroll-slot${active}" aria-pressed="${view.conv === ci}" data-conv="${ci}">
      <svg width="56" height="50" viewBox="-28 -25 56 50" aria-hidden="true">
        <polygon class="housing" points="${tri(22)}"/>
        <polygon class="key" points="${tri(15)}"/>
      </svg>
      <span class="scroll-who">${tag ? tag + " " : ""}${esc(label)}</span>
      <span class="scroll-tag">${convName(ci)} · ${c.spirals.length} ${t("spirals")}</span>
    </button>`;
  }
  html += "</div>";

  /* selected conversation thread */
  if (view.conv != null && view.conv < convs.length){
    const conv = convs[view.conv];
    const turns = conv.spirals.map(sp => {
      if (LANG !== "zh" || !sp.zh) return [sp.text, sp.speaker || "", sp.parent];
      const prefix = sp.zh.match(/^([^:：]+)[:：]\s*/);
      return prefix && sp.speaker
        ? [sp.zh.slice(prefix[0].length), prefix[1], sp.parent]
        : [sp.zh, "", sp.parent];
    });
    const payload = {version:1,lang:LANG,where:locName(loc.location),turns};
    const href = "nomai-scriptorium.html#library-scroll=" + encodeURIComponent(JSON.stringify(payload));
    html = html.replace('<div id="scroll-actions"></div>', `<div id="scroll-actions" class="scroll-actions">
      <button class="log-key" id="read-here">${LANG === "zh" ? "在文库中阅读" : "Read in Repository"}</button>
      <a class="log-key study-choice" href="${esc(href)}" target="_blank" rel="noopener">${LANG === "zh" ? "在书房中阅读" : "Read in Scriptorium"}</a></div>`);
    if (view.reading) html += renderConv(convs[view.conv], view.conv);
  }

  m.innerHTML = html;
  /* The wall itself, in the gaps between scrolls. Clicking the same slot again always
     did this, but only for somebody who thought to try it, and a selection with no
     visible way out of it reads as stuck. One click, not two: re-selecting costs one
     click, so there is nothing here worth guarding against. */
  const rack = m.querySelector(".rack");
  if (rack) rack.onclick = e => {
    if (view.conv == null || e.target.closest(".scroll-slot")) return;
    view.conv = null;
    view.reading = false;
    renderLocation(m);
  };
  m.querySelectorAll("[data-conv]").forEach(el => el.onclick = () => {
    view.conv = view.conv === +el.dataset.conv ? null : +el.dataset.conv;
    view.reading = false;
    renderLocation(m);
    m.querySelector("#scroll-actions button")?.focus({preventScroll:true});
  });
  const readHere = m.querySelector("#read-here");
  if (readHere) readHere.onclick = async () => {
    if (readHere.disabled || view.reading) return;
    readHere.disabled = true;
    const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
    const key = m.querySelector(".scroll-slot.active .key");
    if (!reduced) await key.animate([
      {transform:"translateY(-4px) rotate(0deg)",opacity:1},
      {transform:"translateY(-16px) rotate(100deg) scale(1.18)",opacity:1,offset:.65},
      {transform:"translateY(-28px) rotate(150deg) scale(.8)",opacity:0}
    ],{duration:280,easing:"ease-in-out",fill:"forwards"}).finished;
    if (!readHere.isConnected) return;
    view.reading = true;
    renderLocation(m);
    if (!reduced) m.querySelectorAll(".conv-pane .trow").forEach((row,i)=>
      row.animate([{transform:"translateY(18px)",opacity:0},{transform:"translateY(0)",opacity:1}],
        {duration:200,delay:i*65,easing:"ease-out",fill:"backwards"}));
  };
}

/* ── Conversation thread ────────────────────────────── */
/* The one place a conversation is named. It is written in three: the list that sends
   you here, the slot you land on, and the thread that opens -- and matching "Conversation
   3" against a rack of near-identical triangles only works while all three agree. */
const convName = i => (LANG === "zh" ? "对话" : "Conversation") + " " + (i + 1);

function renderConv(conv, ci){
  const spirals = conv.spirals;
  const depth = spirals.map(() => 0);
  spirals.forEach((sp, k) => {
    if (sp.parent != null && sp.parent < k) depth[k] = depth[sp.parent] + 1;
  });

  const badges = [];
  if (conv.recording) badges.push(t("recording"));
  if (conv.projection_stone)
    badges.push(t("projection stone") + ": " + conv.projection_stone.join(" ↔ "));
  if (conv.question_pair)
    badges.push(t("question pair") + ": " + conv.question_pair.join(" + "));

  let html = '<div class="conv-pane"><div class="conv-head">';
  html += `<span class="conv-title">${convName(ci)} · ${spirals.length} ${t("spirals")}</span>`;
  for (const b of badges) html += `<span class="conv-badge">${esc(b)}</span>`;
  html += '</div><div class="thread">';

  for (let k = 0; k < spirals.length; k++){
    const sp = spirals[k];
    let said;
    if (LANG === "zh" && sp.zh){
      said = esc(sp.zh);
    } else {
      said = sp.speaker
        ? `<b>${esc(sp.speaker)}:</b> ${esc(sp.text)}`
        : `<span class="unsigned">${esc(sp.text)}</span>`;
    }
    html += `<div class="trow">` +
      `<span class="depth">${"│ ".repeat(depth[k])}</span>` +
      `<span class="said">${said}</span></div>`;
  }
  html += "</div></div>";
  return html;
}

/* ── Search ─────────────────────────────────────────── */
function renderSearch(q){
  const m = $("main");
  const hits = [];
  for (const loc of DATA){
    for (let ci = 0; ci < loc.conversations.length; ci++){
      const conv = loc.conversations[ci];
      for (const sp of conv.spirals){
        const hay = ((sp.speaker || "") + " " + sp.text + " " + (sp.zh || "")).toLowerCase();
        if (hay.includes(q)){
          hits.push({ loc, ci, conv });
          break;
        }
      }
    }
  }
  $("search-hits").textContent = hits.length + (hits.length === 1 ? " result" : " results");
  if (!hits.length){ m.innerHTML = `<p class="empty-note">${t("No results")}</p>`; return; }

  let html = '<div class="loc-list">';
  for (const h of hits){
    const speakers = [...new Set(h.conv.spirals.map(s => s.speaker).filter(Boolean))];
    const label = speakers.slice(0, 3).map(spkName).join(", ");
    html += `<div class="loc-row" data-body="${esc(h.loc.celestial_body)}"
      data-loc="${esc(h.loc.location)}" data-conv="${h.ci}">
      <span class="loc-marker">◇</span>
      <span class="loc-name">${esc(locName(h.loc.location))} — ${esc(label)}</span>
      <span class="loc-count">${esc(bodyName(h.loc.celestial_body))}</span>
    </div>`;
  }
  html += "</div>";
  m.innerHTML = html;
  m.querySelectorAll("[data-conv]").forEach(el =>
    el.onclick = () => nav({
      type:"location",
      body: el.dataset.body,
      location: el.dataset.loc,
      conv: +el.dataset.conv
    }));
}

/* ── Language ───────────────────────────────────────── */
function setLang(v){
  LANG = v;
  try { localStorage.setItem("nomai-repo.lang", v); } catch {}
  $("lang-en").setAttribute("aria-pressed", String(v === "en"));
  $("lang-zh").setAttribute("aria-pressed", String(v === "zh"));
  $("page-title").textContent = t("Nomai Repository");
  $("search").placeholder = t("Search speakers or text…");
  document.documentElement.setAttribute("lang", v);
  render();
}
$("lang-en").onclick = () => setLang("en");
$("lang-zh").onclick = () => setLang("zh");

/* ── Theme ──────────────────────────────────────────── */
function paintThemeKey(){
  const dark = $("theme").getAttribute("aria-checked") === "true";
  $("theme").innerHTML = `<span class="${dark ? "" : "chosen"}">${LANG === "zh" ? "昼" : "Day"}</span><span aria-hidden="true"> / </span><span class="${dark ? "chosen" : ""}">${LANG === "zh" ? "夜" : "Night"}</span>`;
  $("theme").setAttribute("aria-label", LANG === "zh" ? "切换昼夜" : "Switch day and night");
}
$("theme").onclick = () => {
  const isDark = $("theme").getAttribute("aria-checked") === "true";
  const next = isDark ? "light" : "dark";
  $("theme").setAttribute("aria-checked", String(!isDark));
  document.documentElement.setAttribute("data-theme", next);
  paintThemeKey();
  try { localStorage.setItem("nomai-repo.theme", next); } catch {};
};

/* ── Search input ───────────────────────────────────── */
let searchTimer = null;
$("search").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = $("search").value.trim().toLowerCase();
    if (q) renderSearch(q);
    else { $("search-hits").textContent = ""; render(); }
  }, 200);
};

/* ── Init ───────────────────────────────────────────── */
try {
  const lang = localStorage.getItem("nomai-repo.lang");
  if (lang === "zh" || lang === "en") setLang(lang);
  const th = localStorage.getItem("nomai-repo.theme");
  if (th === "light"){
    $("theme").setAttribute("aria-checked", "false");
    document.documentElement.setAttribute("data-theme", "light");
  } else if (th === "dark"){
    document.documentElement.setAttribute("data-theme", "dark");
  }
} catch {}
load();
</script>
