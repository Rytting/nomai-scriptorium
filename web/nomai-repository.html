    "celestial_body": "Timber Hearth",
    "location": "Underwater ruins",
    "conversations": [
      {
        "spirals": [
          {
            "speaker": "COLEUS",
            "text": "After closer observation, mining site 2a wouldn't be safe for the native life dwelling in some cave pools, so (unfortunately) we'll have to mine one of the other sites.",
            "parent": null,
            "zh": "科利耶斯：在经过更加近距离的观察之后，采矿点2a已经不适合当地生命在这个洞窟的某些池塘里居住了，因此（很遗憾），我们只能去其它地点展开开采工作。",
            "zh_source": "official",
            "zh_key": "COLEUS: After closer observation, mining site 2a wouldn’t be safe for the native life dwelling in some of this cave’s pools, so (unfortunately) we’ll have to mine one of the other sites."
          },
          {
            "speaker": "COLEUS",
            "text": "On the opposite hand, new life! This species is semi-aquatic, and very hardy. The ecosystem here is quite robust, so I believe they'll thrive in the long run. Be cautious near the pools if you visit 2a to meet them.",
            "parent": 0,
            "zh": "科利耶斯：而另一方面，这意味着出现了新的生命！这是一种半水生物种，而且适应力极强。这里的生态系统相当坚挺，因此我相信假以时日，它们一定可以茁壮繁衍。假如你来2a参观这些生物，靠近池塘的时候要当心。",
            "zh_source": "official",
            "zh_key": "COLEUS: On the opposite hand, new life! This species is semi-aquatic, and very hardy. The ecosystem here is quite robust, so I believe they’ll thrive in the long run. Be cautious near the pools if you visit 2a to meet them."
          },
          {
            "speaker": "COLEUS",
            "text": "They remind me of a subterranean species that my mentor, Melorae, once told me about (from when our clan used to travel across this universe). I am sure she would have enjoyed these lifeforms greatly.",
            "parent": 1,
            "zh": "科利耶斯：它们让我想起了我的导师梅洛瑞曾经跟我说过的一种地下物种（当时我们家族经常在这个宇宙里航行）。我想她一定会非常喜欢这些生命形式。",
            "zh_source": "official",
            "zh_key": "COLEUS: They remind me of a subterranean species that my mentor, Melorae, once told me about (from when our clan used to travel across this universe). I imagine she would have enjoyed these lifeforms greatly."
          },
          {
            "speaker": "CYCAD",
            "text": "I was watching them once during a rest, and the hours escaped from me. They're fascinating (in wonder what their fourth eye does)!",
            "parent": 1,
            "zh": "赛卡德：有一次休息的时候我观察过它们，一下子就看入迷了。它们真是有意思（不知道它们的第四只眼睛是用来干什么的）！",
            "zh_source": "official",
            "zh_key": "CYCAD: I was watching them once during a rest, and the hours escaped from me. They’re fascinating (I wonder what their fourth eye does)!"
          },
          {
            "speaker": "CYCAD",
            "text": "There are a few other sites that look promising. What about site 2b (it shares similar formations and databases)?",
            "parent": 0,
            "zh": "赛卡德：有几个洞窟看上去可以满足条件。2b这个位置怎么样（那里的地质结构和岩层与2a类似）？",
            "zh_source": "official",
            "zh_key": "CYCAD: There are a few other cave sites that look promising. What about site 2b (it shares similar formations and strata)?"
          },
          {
            "speaker": "OENO",
            "text": "This sounds promising! Will you and your mentor investigate? If mining site 2b proves safe for this native species, we'll move our work there.",
            "parent": 4,
            "zh": "奥埃诺：听上去很可行！你和你的导师能不能去调查一下？如果采矿点2b适合这种当地物种生存，我们就把工作地点搬到那里去。",
            "zh_source": "official",
            "zh_key": "OENO: This sounds promising! Will you and your mentor investigate? If mining site 2b proves safe for this native species, we’ll move our work there."
          },
          {
            "speaker": "CYCAD",
            "text": "Site 2b is safe! Coleus says we’ll continue to monitor our activity and its effect on life here.",
            "parent": 5,
            "zh": "赛卡德：2b是安全的！科利耶斯说我们会继续监控自己的活动，以及该活动对这里的生命所造成的影响。",
            "zh_source": "official",
            "zh_key": "CYCAD: Site 2b is safe! Coleus says we’ll continue to monitor our activity and its effect on life here."
          }
        ]
      }
    ]
  },
  {
    "celestial_body": "Timber Hearth",
    "location": "Eye Signal Locator",
    "conversations": [
      {
        "spirals": [
          {
            "speaker": "COLEUS",
            "text": "I was upstairs testing the Eye signal locator, and it can hear and follow the signals from the sun, Giant's Deep, and Brittle Hollow.",
            "parent": null,
            "zh": "科利耶斯：我之前在楼上测试眼信号定位器，它能听见并追踪来自太阳、深巨星和碎空星的信号。"
          },
          {
            "speaker": "COLEUS",
            "text": "However, something strange is happening when I ask the Eye signal locator to follow the Eye's signal: The device's indicator rotates wildly and never points to just one direction.",
            "parent": 0,
            "zh": "科利耶斯：可是，当我让眼信号定位器追踪眼的信号时，发生了奇怪的事：装置的指示器会疯狂旋转，始终无法指向唯一的方向。"
          },
          {
            "speaker": "THATCH",
            "text": "This is a curious result. It's possible the eye has stopped calling out its signal.",
            "parent": 1,
            "zh": "萨奇：这是个奇特的结果。也许眼已经停止呼唤了。"
          },
          {
            "speaker": "FILIX",
            "text": "I see! I most likely calibrated the locator incorrectly. Privet (my apprentice) and I will make adjustments and try again.",
            "parent": 1,
            "zh": "费利克斯：我明白了！很可能是我没有正确校准定位器。普利维特（我的学徒）和我会进行调整，然后再次尝试。"
          },
          {
            "speaker": "FILIX",
            "text": "An update: Disappointingly, everything is correctly calibrated after all.",
            "parent": 3,
            "zh": "费利克斯：更新：令人失望的是，一切其实都已经正确校准了。"
          },
          {
            "speaker": "CASSAVA",
            "text": "It saddens me to posit this, my friends, but I believe we need to build a more sophisticated device if we want to find the exact location of the Eye of the universe.",
            "parent": 4,
            "zh": "卡萨瓦：朋友们，很遗憾要提出这一点，但我认为，如果想找到宇宙之眼的确切位置，我们就需要建造一台更精密的装置。"
          },
          {
            "speaker": "THATCH",
            "text": "Then we will build it. Don't lose hope, Cassava; our search for the Eye is what brought our clan to this place. We won't give up so easily!",
            "parent": 5,
            "zh": "萨奇：那我们就造。不要失去希望，卡萨瓦；寻找眼是我们的族群来到这里的原因。我们不会这么轻易放弃！"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "THATCH",
            "text": "Where should this new, more sophisticated locator be built? It may need to be larger than this Eye signal locator is.",
            "parent": null,
            "zh": "萨奇：这台更加复杂的新型定位器要建在哪里？占地规模可能得比眼信号定位器要大。",
            "zh_source": "official",
            "zh_key": "THATCH: Where should this new, more sophisticated locator be built? It may need to be larger than this Eye signal locator is."
          },
          {
            "speaker": "COLEUS",
            "text": "Annona and those of us originally stranded on the Ember Twin built a Quantum Moon locator there, but the heat of the sun made its construction challenging. I wouldn't recommend building on that planet.",
            "parent": 0,
            "zh": "科利耶斯：安诺纳还有我们一开始被困在余烬双星的人在那里造了一台量子卫星定位器，可是太阳的热辐射让工程变得十分艰难。我不建议在那颗行星上进行建造。",
            "zh_source": "official",
            "zh_key": "COLEUS: Annona and those of us originally stranded on Ember Twin built a Quantum Moon locator there, but the heat of the sun made its construction challenging. I wouldn’t recommend building on that planet."
          },
          {
            "speaker": "PLUME",
            "text": "The southern glacier on Brittle Hollow has ample available space. I could construct a new building to house this proposed locator.",
            "parent": 0,
            "zh": "普鲁姆：碎空星的南部冰川拥有充足的可用空间。我可以在那里新建一栋建筑来安置这台定位器。",
            "zh_source": "official",
            "zh_key": "PLUME: The southern glacier on Brittle Hollow has ample available space. I could construct a new building to house this proposed locator."
          },
          {
            "speaker": "FILIX",
            "text": "Yes, let's build there! I imagine our young friend Conoy would enjoy that immensely. He's always had a great interest in the Eye, especially for a child born so long after the crash.",
            "parent": 2,
            "zh": "费利克斯：好的，就建在那里吧！我想我们年轻的朋友科诺伊一定会非常喜欢。作为一个坠机之后出生的孩子，他一向对眼兴趣盎然。",
            "zh_source": "official",
            "zh_key": "FILIX: Yes, let’s build there! I imagine our young friend Conoy would enjoy that immensely. He’s always held a great interest in the Eye, especially for a child born so long after the crash."
          },
          {
            "speaker": "PLUME",
            "text": "I will begin construction on Brittle Hollow’s south pole immediately, then!",
            "parent": 0,
            "zh": "普鲁姆：那么，我马上就去碎空星的南极开工！",
            "zh_source": "official",
            "zh_key": "PLUME: I will begin construction on Brittle Hollow’s south pole immediately, then!"
          }
        ]
      }
    ]
  },
  {
    "celestial_body": "Brittle Hollow",
    "location": "Escape pod 1",
    "conversations": [
      {
        "recording": true,
        "spirals": [
          {
            "speaker": "THATCH",
            "text": "Is everyone unharmed?",
            "parent": null,
            "zh": "萨奇：所有人都没事吧？",
            "zh_source": "official",
            "zh_key": "THATCH: Is everyone unharmed?"
          },
          {
            "speaker": "PLUME",
            "text": "No one was badly injured from the escape pod's impact. We're incredibly fortunate.",
            "parent": 0,
            "zh": "普鲁姆：没有人因为逃生舱的冲击而受重伤。我们真是太走运了。",
            "zh_source": "official",
            "zh_key": "PLUME: No one was badly injured from the escape pod’s impact. We’re incredibly fortunate."
          },
          {
            "speaker": "THATCH",
            "text": "This is good news, at least. Have we heard from escape pod 2 or escape pod 3?",
            "parent": 1,
            "zh": "萨奇：至少这算是个好消息。我们有2号逃生舱或者3号逃生舱的消息吗？",
            "zh_source": "official",
            "zh_key": "THATCH: This is good news, at least. Have we heard from Escape Pod 2 or Escape Pod 3?"
          },
          {
            "speaker": "FILIX",
            "text": "No, I… I'm unable to make contact. My equipment can hear the other two escape pod's signals, though. If it's any comfort, both pods must be structurally intact.",
            "parent": 2,
            "zh": "费利克斯：没有，我……我无法进行联络。不过，我的设备可以收到其它两个逃生舱的求救信号。两个逃生舱的结构应该都完好无损。不知道这个消息对你是不是有帮助。",
            "zh_source": "official",
            "zh_key": "FILIX: No, I... I’m unable to make contact. My equipment can hear the other two escape pods’ distress signals, however. If it’s any comfort, both pods must be structurally intact."
          },
          {
            "speaker": "FILIX",
            "text": "I'll continue calling for them.",
            "parent": 3,
            "zh": "费利克斯：我会继续呼叫他们。",
            "zh_source": "official",
            "zh_key": "FILIX: I’ll continue calling for them."
          },
          {
            "speaker": "THATCH",
            "text": "My gratitude. If we can -",
            "parent": 4,
            "zh": "萨奇：感激不尽。如果我们可以……",
            "zh_source": "official",
            "zh_key": "THATCH: My gratitude. If we can —"
          },
          {
            "speaker": "PLUME",
            "text": "Thatch, the moon is approaching again!",
            "parent": 5,
            "zh": "普鲁姆：萨奇，卫星又接近了！",
            "zh_source": "official",
            "zh_key": "PLUME: Thatch, the moon is approaching again!"
          },
          {
            "speaker": "THATCH",
            "text": "Everyone brace yourselves, swiftly! The volcanic moon has returned!",
            "parent": 6,
            "zh": "萨奇：所有人做好准备，快！火山卫星回来了！",
            "zh_source": "official",
            "zh_key": "THATCH: Everyone brace yourselves, swiftly! The volcanic moon has returned!"
          },
          {
            "speaker": "THATCH",
            "text": "Be cautious of falling ash and debris!",
            "parent": 7,
            "zh": "萨奇：当心掉下来的火山灰和岩屑！",
            "zh_source": "official",
            "zh_key": "THATCH: Be cautious of falling ash and debris!"
          },
          {
            "speaker": "PLUME",
            "text": "… I believe the moon has passed.",
            "parent": 8,
            "zh": "普鲁姆：……我想卫星已经走了。",
            "zh_source": "official",
            "zh_key": "PLUME: ...I believe the moon has passed."
          },
          {
            "speaker": "FILIX",
            "text": "This planet doesn't appear eager to have guests. We are certainly unwelcome on this planet.",
            "parent": 9,
            "zh": "费利克斯：这颗行星看来不是很好客。显然我们在它的地表上不受欢迎。",
            "zh_source": "official",
            "zh_key": "FILIX: This planet doesn’t appear eager to have guests. We are certainly unwelcome on its surface."
          },
          {
            "speaker": "THATCH",
            "text": "We need to find shelter, and quickly. The volcanic moon won't be gone for long.",
            "parent": 10,
            "zh": "萨奇：我们得寻找庇护所，而且要快。那颗火山卫星很快就会再回来的。",
            "zh_source": "official",
            "zh_key": "THATCH: We need to find shelter, and quickly. The volcanic moon won’t be gone for long."
          },
          {
            "speaker": "PLUME",
            "text": "I observed several promising sites below the surface, but we'll need to construct a way for everyone to climb safely down this cliff. Perhaps we could safely build platforms?",
            "parent": 11,
            "zh": "普鲁姆：我在地下观察到几个可行的位置，不过我们得造一条路，让大家能够安全地从悬崖上爬下去。也许我们可以建造一些平台？",
            "zh_source": "official",
            "zh_key": "PLUME: I observed several promising sites below the surface, but we’ll need to construct a way for everyone to climb safely down this cliff. Perhaps we could build platforms?"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "PLUME",
            "text": "Use caution! A black hole sleeps below. You must not slip.",
            "parent": null,
            "zh": "普鲁姆：当心！下方沉睡着一个黑洞。千万不要失足。"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "PLUME",
            "text": "Of note: Be sure not to wander far from here. Though this area is somewhat unstable, it's safer than any we've found so far.",
            "parent": null,
            "zh": "普鲁姆：注意：务必不要走远。这片区域虽有些不稳定，但仍是我们目前能找到最安全的地方。"
          },
          {
            "speaker": "PLUME",
            "text": "The temporary settlement is finished, but remember to be cautious of falling rocks and dust caused by meteor impacts.",
            "parent": 0,
            "zh": "普鲁姆：临时庇护所已经建好，但请记得留意撞击产生的落石和尘埃。"
          }
        ]
      }
    ]
  },
  {
    "celestial_body": "Brittle Hollow",
    "location": "Eye shrine",
    "conversations": [
      {
        "spirals": [
          {
            "speaker": "THATCH",
            "text": "This knowledge is too dear to lose: Here is everything we recall about the signal we encountered while aboard the Vessel.",
            "parent": null,
            "zh": "萨奇：这一知识十分关键，一定要保存下来：关于我们在飞船上收到的那个信号，我们所记得的情况都在这里。",
            "zh_source": "official",
            "zh_key": "THATCH: This knowledge is too dear to lose: Here is everything we can recall about the signal we encountered while aboard the Vessel."
          },
          {
            "speaker": "FILIX",
            "text": "The signal looked like an eye: Round, with a circle at the centre much like a pupil. (Suppose the signal was looking for something.)",
            "parent": 0,
            "zh": "费利克斯：那个信号看上去像是一只眼睛，中央有个与瞳孔十分类似的圆形。（估计信号在寻找什么东西。）",
            "zh_source": "official",
            "zh_key": "FILIX: The signal looked like an eye: round, with a circle at the center much like a pupil. (Suppose the signal was looking for something.)"
          },
          {
            "speaker": "FILIX",
            "text": "The signal was older than the universe itself! This is the most significant detail.",
            "parent": 0,
            "zh": "费利克斯：那个信号比宇宙本身还要古老！这是最重要的细节。",
            "zh_source": "official",
            "zh_key": "FILIX: The signal was older than the universe itself! This is the most significant detail."
          },
          {
            "speaker": "PLUME",
            "text": "No Nomai clan has ever encountered anything like it! How can anything in this universe be older than the universe itself?",
            "parent": 2,
            "zh": "普鲁姆：以前从来没有哪个挪麦家族遇到过这样的东西！这个宇宙里怎么会有比宇宙本身还要古老的对象？",
            "zh_source": "official",
            "zh_key": "PLUME: No Nomai clan has ever encountered anything like it! How can anything in this universe be older than the universe itself?"
          },
          {
            "speaker": "THATCH",
            "text": "Imagine what rare and profound knowledge it might offer. We *must* find this Eye of the universe.",
            "parent": 3,
            "zh": "萨奇：想想看，我们将会从它的身上了解到多么少有以及深远的知识。我们必须找到这个宇宙之眼。",
            "zh_source": "official",
            "zh_key": "THATCH: Imagine what rare and profound knowledge it might offer. We <i>must</i> find this Eye of the universe."
          }
        ]
      }
    ]
  },
  {
    "celestial_body": "Brittle Hollow",
    "location": "Vessel Crash Room",
    "conversations": [
      {
        "spirals": [
          {
            "speaker": "THATCH",
            "text": "I can't understand. Why did the Vessel crash in that place?",
            "parent": null,
            "zh": "萨奇：我实在想不通。母舰为什么会坠毁在那个地方？"
          },
          {
            "speaker": "PLUME",
            "text": "Was the Vessel unwell in some way?",
            "parent": 0,
            "zh": "普鲁姆：母舰是不是哪儿出了毛病？"
          },
          {
            "speaker": "FILIX",
            "text": "No, Annona and I checked before the warp, and the warp core and navigation systems were both well.",
            "parent": 1,
            "zh": "费利克斯：不，跃迁之前安诺纳和我做过检查，跃迁核心和导航系统都好着呢。"
          },
          {
            "speaker": "FILIX",
            "text": "We warped to follow that curious signal from the eye of the universe. Where we arrived was wrong; it wasn't where we tried to go.",
            "parent": 0,
            "zh": "费利克斯：我们是跟着宇宙之眼发出的神秘信号进行跃迁的。然而，我们抵达的地点却完全错了——那根本不是我们原本想要前往的目的地。"
          },
          {
            "speaker": "THATCH",
            "text": "Suppose it wasn't a problem with the Vessel, but with our destination.",
            "parent": 3,
            "zh": "萨奇：假设不是母舰出了问题，而是我们的目的地出了问题。"
          },
          {
            "speaker": "FILIX",
            "text": "I'm afraid for our friends in escape pod 3…",
            "parent": 4,
            "zh": "费利克斯：我很担心我们在3号逃生舱里的朋友们……"
          }
        ]
      }
    ]
  },
  {
    "celestial_body": "Brittle Hollow",
    "location": "Insignificant Buildings",
    "conversations": [
      {
        "spirals": [
          {
            "speaker": "KOUSA",
            "text": "We can hear the other escape pod’s distress signals, which gives me hope. Foli, are you still here? I am unsure how to survive in this place without you.",
            "parent": null,
            "zh": "库萨：我们可以听到其它逃生舱的求救信号，这给了我希望。弗利，你还在吗？真不知道没有你，我该怎么在这个地方活下去。",
            "zh_source": "official",
            "zh_key": "KOUSA: We can hear the other escape pods’ distress signals, which gives me hope. Foli, are you still here? I am unsure how to survive in this place without you."
          },
          {
            "speaker": "KOUSA",
            "text": "(I am unsure how to be me without you.)",
            "parent": 0,
            "zh": "库萨：（真不知道没有你我该怎么办。）",
            "zh_source": "official",
            "zh_key": "KOUSA: (I am unsure how to be me without you.)"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "PLUME",
            "text": "My brother wasn't in escape pod 1 with us. Was he in pod 2, or pod 3? Was he able to board an escape pod at all?",
            "parent": null,
            "zh": "普鲁姆：我的兄弟没有和我们一起登上1号逃生舱。他会不会在2号逃生舱，或是3号逃生舱里？他到底有没有登上逃生舱？",
            "zh_source": "official",
            "zh_key": "PLUME: My brother wasn’t in Escape Pod 1 with us. Was he in Pod 2, or Pod 3? Was he able to board an escape pod at all?"
          },
          {
            "speaker": "PLUME",
            "text": "We sacrificed too much arriving here. I cannot (I *will* not) allow our clan's greatest loss to be in vain.",
            "parent": 0,
            "zh": "普鲁姆：为了能够来到这里，我们做出了太多牺牲。我们的家族蒙受了最为惨重的损失，我不能（我不会）无功而返。",
            "zh_source": "official",
            "zh_key": "PLUME: We sacrificed too much arriving here. I cannot (<i>I will</i> not) allow our clan’s greatest loss to be in vain."
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "THATCH",
            "text": "Is the hardest part of this tragedy not knowing who we may have lost? Or will the hardest part come later, when we learn? (Be well, aunt Melorae...)",
            "parent": null,
            "zh": "萨奇：难道说，这个方案最令人难以接受的部分，在于我们不知道将会失去谁？或是说最严峻的考验还在后头？（多保重，梅洛瑞姨妈……）",
            "zh_source": "official",
            "zh_key": "THATCH: Is the hardest part of this tragedy not knowing who we may have lost? Or will the hardest part come later, when we learn? (Be well, Aunt Melorae...)"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "PLUME",
            "text": "The pain of your absence is sharp and haunting, and I would give anything not to know it; anything but never knowing you at all (which would be worse).",
            "parent": null,
            "zh": "普鲁姆：你不在让我心如刀绞。如果能让我好过一些，我愿意付出一切代价。一切代价，除了无法与你相识（那样的话我会更加痛不欲生）。",
            "zh_source": "official",
            "zh_key": "PLUME: The pain of your absence is sharp and haunting, and I would give anything not to know it; anything but never knowing you at all (which would be worse)."
          },
          {
            "speaker": "PLUME",
            "text": "I can only hope that you are safe, Keek, wherever you are.",
            "parent": 0,
            "zh": "普鲁姆：无论你在哪儿，奇克，我只希望你能够平安无事。",
            "zh_source": "official",
            "zh_key": "PLUME: I can only hope that you are safe, Keek, wherever you are."
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "ILEX",
            "text": "Look out, look out below!",
            "parent": null,
            "zh": "艾莱克斯：小心啊，小心啊！"
          },
          {
            "speaker": "ILEX",
            "text": "Look out for the gravity hole!",
            "parent": 0,
            "zh": "艾莱克斯：重力洞就在底下！"
          },
          {
            "speaker": "ILEX",
            "text": "For should you slip",
            "parent": 1,
            "zh": "艾莱克斯：要是不幸脚一滑"
          },
          {
            "speaker": "ILEX",
            "text": "And lose your grip,",
            "parent": 2,
            "zh": "艾莱克斯：手边又没地方抓"
          },
          {
            "speaker": "ILEX",
            "text": "Then into space you'll go!",
            "parent": 3,
            "zh": "艾莱克斯：太空就是你的家！"
          }
        ]
      }
    ]
  },
  {
    "celestial_body": "Brittle Hollow",
    "location": "Gravity Bridge",
    "conversations": [
      {
        "spirals": [
          {
            "speaker": "PLUME",
            "text": "Given concerns about our settlements stability, where should we construct a new, less temporary shelter?",
            "parent": null,
            "zh": "普鲁姆：鉴于我们定居点的坚固程度，我们是不是应该建造一个比较长期的新庇护所？",
            "zh_source": "official",
            "zh_key": "PLUME: Given concerns about our settlement’s stability, where should we construct a new, less temporary shelter?"
          },
          {
            "speaker": "THATCH",
            "text": "We need to stay close to the escape pod so Filix can monitor incoming messages. We can't be rescued if we aren't present to respond.",
            "parent": 0,
            "zh": "萨奇：我们得待在逃生舱附近，这样费利克斯才能对传来的消息进行监控。如果我们不进行回应，那么别人就没法把我们救走。",
            "zh_source": "official",
            "zh_key": "THATCH: We need to stay close to the escape pod so Filix can monitor incoming messages. We can’t be rescued if we aren’t present to respond."
          },
          {
            "speaker": "FILIX",
            "text": "I don't believe anyone is coming to save us, Thatch. Now we must save ourselves.",
            "parent": 1,
            "zh": "费利克斯：我觉得不会有人来救我们了，萨奇。现在我们必须靠自己才行。",
            "zh_source": "official",
            "zh_key": "FILIX: I don’t believe anyone is coming to save us, Thatch. Now we must save ourselves."
          },
          {
            "speaker": "PLUME",
            "text": "I agree. We're here because the Eye's signal called to us and we followed. If we're to find it, we need to not merely survive, but thrive.",
            "parent": 2,
            "zh": "普鲁姆：我同意。我们收到了眼的信号，跟着它才来到了这里。如果能够找到它，那么我们不但可以活下来，还能繁衍生息。",
            "zh_source": "official",
            "zh_key": "PLUME: I agree. We’re here because the Eye’s signal called to us and we followed. If we’re to find it, we need to not merely survive, but thrive."
          },
          {
            "speaker": "THATCH",
            "text": "This is a wise point, Plume, and eloquently made. If moving to the Northern glacier will keep us safer, then that is what we should do.",
            "parent": 3,
            "zh": "萨奇：你的看法很明智，普鲁姆，而且无可辩驳。如果移动到北部冰川可以让我们更加安全，那我们就走吧。",
            "zh_source": "official",
            "zh_key": "THATCH: This is a wise point, Plume, and eloquently made. If moving to the northern glacier will keep us safer, then that is what we should do."
          },
          {
            "speaker": "PLUME",
            "text": "I believe we should migrate to the North glacier.",
            "parent": 0,
            "zh": "普鲁姆：我相信我们应该往北部冰川迁徙。",
            "zh_source": "official",
            "zh_key": "PLUME: I believe we should migrate to the northern glacier."
          },
          {
            "speaker": "THATCH",
            "text": "Building beneath the crust again would shelter us from the volcanic moon's eruptions.",
            "parent": 0,
            "zh": "萨奇：再次在地壳下方进行建造可以保护我们免除火山卫星喷发的危险。",
            "zh_source": "official",
            "zh_key": "THATCH: Building beneath the crust again would shelter us from the volcanic moon’s eruptions."
          },
          {
            "speaker": "FILIX",
            "text": "What if we used gravity crystals to craft a stable path?",
            "parent": 0,
            "zh": "费利克斯：我们用重力水晶制造一条稳定的道路如何？",
            "zh_source": "official",
            "zh_key": "FILIX: What if we use gravity crystals to craft a stable path?"
          }
        ]
      }
    ]
  },
  {
    "celestial_body": "Brittle Hollow",
    "location": "School district",
    "conversations": [
      {
        "spirals": [
          {
            "speaker": "LAMI",
            "text": "Explanation of Festivals",
            "parent": null,
            "zh": "拉米：关于节日的解释"
          },
          {
            "speaker": "LAMI",
            "text": "All the Nomai clans from all over the universe meet in one place to share what they've learned in science and art. It's called the festival!",
            "parent": 0,
            "zh": "拉米：全宇宙所有的挪麦氏族都会齐聚一处，分享大家在科学与艺术上的发现。这就是“节日”！"
          },
          {
            "speaker": "FILIX",
            "text": "Don't forget, festivals happen every ten years!",
            "parent": 1,
            "zh": "费利克斯：别忘了，节日每十年举办一次哦！"
          },
          {
            "speaker": "LAMI",
            "text": "We can't go because we're stuck here. But Filix says we used to go, too.",
            "parent": 1,
            "zh": "拉米：我们被困在这儿了，所以没法参加。但费利克斯说我们以前也会去的。"
          },
          {
            "speaker": "LAMI",
            "text": "At some festivals, one clan's big discovery can mean all the Nomai get to advance, too. Like Annona's warp core, which made it so everyone can warp long distances and explore more.",
            "parent": 1,
            "zh": "拉米：在某几届节日里，一个氏族的重大发现，也就意味着全体挪麦的进步。比如说安诺纳的跃迁核心，它让大家能够跃迁到更远的距离，进行更全面的探索。"
          },
          {
            "speaker": "LAMI",
            "text": "Each clan has a festival envoy to show their most interesting work. (Our envoy was Thatch!)",
            "parent": 1,
            "zh": "拉米：每个氏族都会派出一位“节日特使”，负责展示各自最有趣的成果。（我们氏族的特使是萨奇！）"
          },
          {
            "speaker": "LAMI",
            "text": "A single festival could last a long, long time!",
            "parent": 5,
            "zh": "拉米：一届节日可以持续很长、很长的时间！"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "SOLANUM",
            "text": "Formation of This Universe",
            "parent": null,
            "zh": "所莱内姆：这个宇宙的形成"
          },
          {
            "speaker": "SOLANUM",
            "text": "No one knows how this universe was made, but one thing we do know is everything used to be very hot and dense (tightly packed together).",
            "parent": 0,
            "zh": "所莱内姆：没人知道这个宇宙是如何诞生的，但有一件事我们可以确定，那就是从前一切都非常炽热、非常致密（紧紧地挤压在一起）。"
          },
          {
            "speaker": "SOLANUM",
            "text": "As this early universe expanded, it also cooled down. Once it had cooled down enough, particles were able to group together and form things like galaxies, stars and planets!",
            "parent": 1,
            "zh": "所莱内姆：当这个早期宇宙膨胀的时候，它也在逐渐冷却。一旦温度降得足够低，粒子便开始聚集，形成了星系、恒星和行星这样的东西！"
          },
          {
            "speaker": "SOLANUM",
            "text": "Since then, space has continued to grow at a faster and faster rate, which is hard to think about without your brain hurting.",
            "parent": 2,
            "zh": "所莱内姆：那之后，太空还在不停地膨胀，速度越来越快，让人琢磨久了还会脑瓜子疼。"
          },
          {
            "speaker": "SOLANUM",
            "text": "This universe will keep getting colder and larger, until one day, the stars and the life they support will all die.",
            "parent": 3,
            "zh": "所莱内姆：这个宇宙还会继续变得越来越冷，越来越大，直到有一天，所有的星星，以及它们所孕育的生命，都会统统死亡。"
          },
          {
            "speaker": "SOLANUM",
            "text": "That's scary to think about, even though Conoy tells me it won't happen in our lifetimes. But it'll happen in someone else's, someday!",
            "parent": 4,
            "zh": "所莱内姆：虽然科诺伊告诉我说，我们这辈子不会面临这样的事情，可是想想还是很吓人。而且总有一天，别人会迎来这一天！"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "ILEX",
            "text": "Why We Should Build A New Vessel",
            "parent": null,
            "zh": "艾莱克斯：我们为什么要建造一艘新的飞船",
            "zh_source": "official",
            "zh_key": "ILEX: Why We Should Build A New Vessel"
          },
          {
            "speaker": "ILEX",
            "text": "Each Nomai clan explores the universe in its own Vessel. The Vessel is in the heart of every clan.",
            "parent": 0,
            "zh": "艾莱克斯：所有挪麦家族都会乘坐自己的飞船来探索宇宙。飞船是每一个家族的核心。",
            "zh_source": "official",
            "zh_key": "ILEX: Each Nomai clan explores the universe in its own Vessel. The Vessel is the heart of every clan."
          },
          {
            "speaker": "ILEX",
            "text": "It's unusual for Nomai to remain in one place for so long. Nomai are wanderers and have no permanent home.",
            "parent": 0,
            "zh": "艾莱克斯：挪麦人在一个地方逗留这么长时间是很不寻常的。挪麦人都是漫游者，居无定所。",
            "zh_source": "official",
            "zh_key": "ILEX: It’s unusual for Nomai to remain in one place for so long. Nomai are wanderers and have no permanent home."
          },
          {
            "speaker": "ILEX",
            "text": "If we built a new Vessel we could return to our adventurous way of life. Imagine all the new places we could go! Our clan wouldn't be stuck here in this star system.",
            "parent": 2,
            "zh": "艾莱克斯：如果我们建造一艘新的飞船，就可以重归冒险生活。想想看，我们将会前往哪些新的地方！我们的家族是不会被困在在这个星系里的。",
            "zh_source": "official",
            "zh_key": "ILEX: If we built a new Vessel, we could return to our adventurous way of life. Imagine all the new places we could go! Our clan wouldn’t be stuck here in this star system."
          },
          {
            "speaker": "ILEX",
            "text": "We could even meet with other Nomai, and learn from them, like Coleus says we used to do.",
            "parent": 3,
            "zh": "艾莱克斯：我们还能和其他挪麦人见面，学习他们掌握的知识。我们以前就是这样做的，就像科利耶斯说得那样。",
            "zh_source": "official",
            "zh_key": "ILEX: We could even meet with other Nomai, and learn from them, like Coleus says we used to do."
          },
          {
            "speaker": "ILEX",
            "text": "It probably wouldn't be hard to get parts if we stopped building other new things, and if we broke down other structures (like the towers on Ash Twin) for parts.",
            "parent": 4,
            "zh": "艾莱克斯：假如我们别再建造其它的新东西，并且把其它建筑拆掉（比如灰烬双星上的那些高塔），说不定就不愁弄不到零件了。",
            "zh_source": "official",
            "zh_key": "ILEX: It probably wouldn’t be hard to get parts if we stopped building other new things, and if we broke down other structures (like the towers on Ash Twin) for parts."
          },
          {
            "speaker": "ILEX",
            "text": "We could even have a warp core for jumping long distances like Vessels have. Poke tells me she plans to make a very advanced warp core for a different project. I'm sure she could connect it to the Vessel for travel (because Poke is smart).",
            "parent": 4,
            "zh": "艾莱克斯：我们还有一颗可以进行远距离跳跃的跃迁核心，就像飞船上的核心那样。珀克告诉我，她打算为其它计划制造一颗非常高级的跃迁核心。我肯定她可以把核心和飞船进行连接，用它来航行（因为珀克很聪明）。",
            "zh_source": "official",
            "zh_key": "ILEX: We could even have a warp core for jumping long distances like Vessels have. Poke tells me she plans to make a very advanced warp core for a different project. I’m sure she could connect it to the Vessel for travel (because Poke is smart)."
          },
          {
            "speaker": "ILEX",
            "text": "We might have to build a smaller Vessel for now, even though Vessels are normally large. But we could make it bigger later once we reach planets with more resources.",
            "parent": 4,
            "zh": "艾莱克斯：我们目前也许只能建造一艘小一点的飞船。虽然一般来说飞船都很大。但是我们可以在抵达其它资源更多的行星时，再把飞船造得更大。",
            "zh_source": "official",
            "zh_key": "ILEX: We might have to build a smaller Vessel for now, even though Vessels are normally large. But we could make it bigger later once we reach planets with more resources."
          },
          {
            "speaker": "ILEX",
            "text": "It would also help if we stopped building so many things to search for the Eye of the universe. I asked Yarrow, and he says we use lots of resources on the Ash Twin Project.",
            "parent": 4,
            "zh": "艾莱克斯：如果我们不再造那么多东西去寻找宇宙之眼就好了。我问过亚罗，他说我们在灰烬双星计划上投入了许多资源。",
            "zh_source": "official",
            "zh_key": "ILEX: It would also help if we stopped building so many things to search for the Eye of the universe. I asked Yarrow, and he says we use lots of resources on the Ash Twin Project."
          }
        ]
      }
    ]
  },
  {
    "celestial_body": "Brittle Hollow",
    "location": "Meltwater District",
    "conversations": [
      {
        "spirals": [
          {
            "speaker": "",
            "text": "The Ash Twin Project requires a powerful, highly advanced warp core. How should we obtain it?",
            "parent": null,
            "zh": "灰烬双星计划需要一个强大、非常高级的跃迁核心。我们如何获得它？"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "",
            "text": "Solution 1: We could retrieve the warp core from the Vessel.",
            "parent": null,
            "zh": "解决方案1：我们可以从飞船上面把跃迁核心回收回来。",
            "zh_source": "official",
            "zh_key": "Solution 1: We could retrieve the warp core from the Vessel."
          },
          {
            "speaker": "RAMIE",
            "text": "The Vessel’s warp core is broken, at best (recall those present when the Vessel crashed said it sustained lethal injuries). There is no guaranteed reward for this risk.",
            "parent": 0,
            "zh": "瑞米：乐观估计，飞船的跃迁核心已经坏了（回想飞船坠落当时所提到的，核心受到了致命的损伤）。这次冒险未必能够得到回报。",
            "zh_source": "official",
            "zh_key": "RAMIE: The Vessel’s warp core is broken, at best (recall those present when the Vessel crashed said it sustained lethal injuries). There is no guaranteed reward for this risk."
          },
          {
            "speaker": "CASSAVA",
            "text": "Even if it no longer functions, the old core would be a valuable blueprint, provided we're able to transport it back here.",
            "parent": 0,
            "zh": "卡萨瓦：就算旧核心已经无法工作了，只要我们能够把它给运回来，它依然可以为我们提供宝贵的设计蓝图。",
            "zh_source": "official",
            "zh_key": "CASSAVA: Even if it no longer functions, the old core could be a valuable blueprint, provided we’re able to transport it back here."
          },
          {
            "speaker": "CONOY",
            "text": "Perhaps we could still repair it. My grandmother told me there was little time to assess the nature or extent of the damage.",
            "parent": 0,
            "zh": "科诺伊：也许我们依然应该把它修好。我的祖母告诉过我，没有时间可以去评估损失的性质或者是程度。",
            "zh_source": "official",
            "zh_key": "CONOY: Perhaps we could still repair it. My grandmother told me there was little time to assess the nature or extent of the damage."
          },
          {
            "speaker": "PHLOX",
            "text": "This would require a return to Dark Bramble. Plume (my father) said many a good Nomai perished there.",
            "parent": 0,
            "zh": "弗拉克斯：这样我们就得回到黑棘星去。普鲁姆（我的父亲）说过，许多出色的挪麦人都在那里失去了生命。",
            "zh_source": "official",
            "zh_key": "PHLOX: This would require a return to Dark Bramble. Plume (my father) said many good Nomai perished there."
          },
          {
            "speaker": "CYCAD",
            "text": "My mentor (Coleus) and his old mentor once discovered and studied an anglerfish fossil on Ember Twin. Using that knowledge, we could avoid the anglerfish entirely!",
            "parent": 0,
            "zh": "赛卡德：我的导师（科利耶斯）和他从前的导师有一次在余烬双星上发现过一块安康鱼化石，并对其进行了研究。通过这些知识，我们完全可以避开安康鱼！",
            "zh_source": "official",
            "zh_key": "CYCAD: My mentor (Coleus) and his old mentor once discovered and studied an anglerfish fossil on Ember Twin. Using that knowledge, we could avoid the anglerfish entirely!"
          },
          {
            "speaker": "COLEUS",
            "text": "What Melorae and I learned from that fossil would theoretically help us evade the anglerfish, but my hypothesis was never tested on a live specimen.",
            "parent": 0,
            "zh": "科利耶斯：从理论上来讲，梅洛瑞和我从化石上了解到的内容可以帮助我们躲避安康鱼，但我们的假设从来没有在活体标本上进行过验证。",
            "zh_source": "official",
            "zh_key": "COLEUS: What Melorae and I learned from that fossil would theoretically help us evade the anglerfish, but our hypothesis was never tested on a live specimen."
          },
          {
            "speaker": "RAMIE",
            "text": "I remember that anglerfish fossil! We used to play in Fossil Fish Cave when we were children.",
            "parent": 0,
            "zh": "瑞米：我记得那块安康鱼化石！我们小的时候曾经在化石鱼洞里面玩过游戏。",
            "zh_source": "official",
            "zh_key": "RAMIE: I remember that anglerfish fossil! We used to play in Fossil Fish Cave when we were children."
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "",
            "text": "Solution 2: We could craft a new advanced warp core inspired by the Vessel’s warp core.",
            "parent": null,
            "zh": "方案2：我们以母舰的跃迁核心为灵感，打造一个新的高级跃迁核心。"
          },
          {
            "speaker": "POKE",
            "text": "I would very much like to craft such a powerful core! More relevantly, I believe the Black Hole Forge crew and I could recreate the basic design.",
            "parent": 0,
            "zh": "珀克：我非常想亲手制造这样一个强大的核心！更重要的是，我相信黑洞熔炉的团队和我能够重现基本设计。"
          },
          {
            "speaker": "SPIRE",
            "text": "Abandoning the Vessel's warp core and its casing means losing valuable knowledge.",
            "parent": 0,
            "zh": "斯拜尔：放弃母舰的跃迁核心及其外壳，意味着我们将会失去许多宝贵的知识。"
          },
          {
            "speaker": "MITIS",
            "text": "This is true; however, it's knowledge we have little hope of recovering. It would be best to relearn, I think.",
            "parent": 0,
            "zh": "迈泰斯：确实如此，但这毕竟是我们几乎无望复得的知识。依我看，最好的办法还是从头学起。"
          },
          {
            "speaker": "IDAEA",
            "text": "This is the safest path for our clan.",
            "parent": 3,
            "zh": "伊代亚：这对我们氏族而言，无疑是最稳妥的一条路。"
          },
          {
            "speaker": "AVENS",
            "text": "Is the safest path the best one? Our goal is worth the risk.",
            "parent": 3,
            "zh": "埃文斯：最稳妥的路就一定是最好的路吗？为了实现我们的目标，冒些风险是值得的。"
          },
          {
            "speaker": "CASSAVA",

  {

            "zh_key": "SOLANUM: I am here! After watching it wander the skies for so long, I am about to stand (for the first time) on the Quantum Moon."

          {
            "speaker": "SOLANUM",
            "text": "As expected, my shuttle has landed at the moon's south pole. I will make the remainder of my journey on foot.",
            "parent": 0,
            "zh": "所莱内姆：和预想中一样，我的航天飞机已经降落在了卫星的南极。剩下的路我就步行吧。",

            "zh_key": "SOLANUM: As expected, my shuttle has landed at the moon’s south pole. I will make the remainder of my journey on foot."

          {
            "speaker": "SOLANUM",
            "text": "We don't know why the Quantum Moon always welcomes its visitors at the south pole, just that this is true.",
            "parent": 1,
            "zh": "所莱内姆：不知道为什么，凡是造访量子卫星的人，都会在南极降落。我只知道，这事从来都没有过例外。",
            "zh_source": "official",
            "zh_key": "SOLANUM: We don’t know why the Quantum Moon always welcomes its visitors at the south pole, just that this is true."
          },
          {
            "speaker": "SOLANUM",
            "text": "As a child, I considered such unknowns sinister. Now though, I understand they bear no ill will. The universe is, and we are.",
            "parent": 2,
            "zh": "所莱内姆：我还小的时候，觉得这种让人无法理解的事情都很可疑。可现在，我明白了，其实谁也没有恶意。宇宙如此，我们也是一样。",
            "zh_source": "official",
            "zh_key": "SOLANUM: As a child, I considered such unknowns sinister. Now, though, I understand they bear no ill will. The universe is, and we are."

  },
  {
    "celestial_body": "Brittle Hollow",
    "location": "Tower of Quantum Knowledge",
    "conversations": [
      {
        "spirals": [
          {
            "speaker": "PLUME",
            "text": "The *trees* are moving! The trees in this grove wander about freely (the entire plant, roots and all! This is *not* normal, even for this alien planet. And I never see them move! Is that even possible?!",
            "parent": null,
            "zh": "普鲁姆：树木在移动！这片树林里的树会到处乱跑（包括树根在内的整棵树）！就算这是一颗外星球，这种情况也绝对不正常。而我却从来没有见过它们移动的样子！这怎么可能？！"
          },
          {
            "speaker": "PLUME",
            "text": "If anyone else witnesses this disturbing behaviour, I implore you, record your observations here. either these trees are aberrant, or my brain must be!",
            "parent": 0,
            "zh": "普鲁姆：如果还有其他人目睹了这种令人不安的现象，我恳请你，把你的观察记录在这里。这些树和我的脑子之间肯定有一个出了问题！"
          },
          {
            "speaker": "THATCH",
            "text": "Plume is right; the trees *do* move! I confess I didn't notice until I read his notes.",
            "parent": 1,
            "zh": "萨奇：普鲁姆说得没错，那些树确实会动！老实说，在看到他的笔记之前，我并没有注意到这一点。"
          },
          {
            "speaker": "THATCH",
            "text": "Alarmingly, it isn't only the trees: There is other matter in this area (such as that unusual shard of rock) moving in this same eerie way.",
            "parent": 1,
            "zh": "萨奇：更令人担忧的是，不仅仅是树木：这片区域还有其他物质（比如那块不寻常的岩石碎片）也在以同样诡异的方式移动。"
          },
          {
            "speaker": "FILIX",
            "text": "That rock is unusual for another reason, too, Thatch: It possesses color and texture I've never seen elsewhere on this planet",
            "parent": 1,
            "zh": "费利克斯：那块岩石还有一个不寻常的地方，萨奇：它的颜色和质地是我在这个星球上其他地方从未见过的！"
          },
          {
            "speaker": "FILIX",
            "text": "Hypothesis: This rock shards presence is significant. We should study it! (Could it be what is causing other objects to also move about this area?)",
            "parent": 4,
            "zh": "费利克斯：假设：这块岩石碎片具有重大意义。我们应该对它展开研究！（附近的其它物体也在这一区域到处移动，会不会就是它引起的？）"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "THATCH",
            "text": "Plume, Filix and I have determined this atypical shard of rock is the reason objects In this grove are behaving in a quantum manner.",
            "parent": null,
            "zh": "萨奇：普鲁姆、费利克斯和我已经做出推断，这片树林的物体之所以会表现出量子特征，原因就是这种异常的岩石碎片。"
          },
          {
            "speaker": "FILIX",
            "text": "Of note: A unique signal is coming from this shard! Curiously, our friend the wandering moon sounds the same.",
            "parent": 0,
            "zh": "费利克斯：注意：这块碎片在发出一种独特的信号！奇妙的是，我们的朋友，流浪卫星发出的信号听起来也如出一辙。"
          },
          {
            "speaker": "FILIX",
            "text": "I've also heard the same signal this shard produces calling from Giant’s Deep, Timber Hearth, and the Hourglass Twins. Suppose there are other shards like this one!",
            "parent": 0,
            "zh": "费利克斯：我还听到深巨星、木炉星，和沙漏双星也传出了和这块碎片相同的信号。假设那里也有其它碎片，就像这块一样！"
          },
          {
            "speaker": "THATCH",
            "text": "The only other object we've observed displaying this quantum behaviour is the wandering moon. I imagine the moon’s behavior and the grove's are related.",
            "parent": 2,
            "zh": "萨奇：除它之外，唯一被我们观察到具有这种量子表现的物体只有流浪卫星，我想这片树林的行为和那颗卫星是相关的。"
          },
          {
            "speaker": "PLUME",
            "text": "In her note from earlier, Filix mentions this strange type of rock isn't found elsewhere on Brittle Hollow. What if it isn't originally from this planet?",
            "parent": 2,
            "zh": "普鲁姆：在费利克斯之前的笔记里，她提到过碎空星的其它地方并没有这种奇怪的岩石。如果它并不是来自于这颗行星呢？"
          },
          {
            "speaker": "PLUME",
            "text": "Hypothesis: This \"quantum shard\" is from the wandering (quantum) moon. Perhaps it is even a small piece of the moon itself.",
            "parent": 4,
            "zh": "普鲁姆：假设：这块“量子碎片”来自于流浪（量子）卫星。或许它就是卫星本身的一小块。"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "BELLS",
            "text": "Beneath your feet lies the Tower of Quantum Knowledge.",
            "parent": null,
            "zh": "贝尔斯：在你的脚下，便是量子知识之塔。"
          },
          {
            "speaker": "BELLS",
            "text": "If you are preparing to make your first pilgrimage to the Quantum Moon, descend the steps to the entrance below. The knowledge held within will help you on your journey.",
            "parent": 0,
            "zh": "贝尔斯：如果你正准备前往量子卫星进行首次朝圣，请沿台阶下行，前往下方的入口。其中蕴藏的知识将在旅途中助你一臂之力。"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "BELLS",
            "text": "If you're here to make your first pilgrimage to the Quantum Moon, you are almost prepared to set out on this deeply significant journey. Before you do, pause and remember your history.",
            "parent": null,
            "zh": "贝尔斯：如果你来到这里，是为了前往量子卫星进行首次朝圣，那么说明你已基本准备就绪，即将出发踏上这段意义深远的旅程。但在启程之前，请稍作停顿，回顾一下我们的历史。"
          },
          {
            "speaker": "BELLS",
            "text": "We make this journey not only for ourselves, but also to honour the members of our clan who came before us: Those who, after the crash that brought them to this star systems, became stranded on Brittle Hollow and on Ember Twin, with no communication between these two groups of survivors.",
            "parent": 0,
            "zh": "贝尔斯：此行的目的不仅仅是为了我们自己，也是为了缅怀族中的先辈：因坠机流落这个星系的两批幸存者，分别被困在碎空星和余烬双星上，彼此之间音讯全无。"
          },
          {
            "speaker": "BELLS",
            "text": "These Nomai looked upwards from two different planets and saw the same wandering moon visiting their skies. It was this moon (the Quantum Moon) that kept their curiosity alive during this long period of hardship.",
            "parent": 1,
            "zh": "贝尔斯：这些挪麦从两颗不同的星球上仰望宇宙，看着同样的流浪卫星造访天空。这段漫长的艰难岁月里，正是因为这颗卫星（量子卫星），大家内心的求知欲才没有被磨灭。"
          },
          {
            "speaker": "BELLS",
            "text": "After the two divided groups were able to reunite, it became our clan's united goal to find and visit the Quantum Moon. This took time, and many Nomai who dreamed of seeing the Quantum Moon died before we discovered how to make the journey.",
            "parent": 2,
            "zh": "贝尔斯：两批人终于得以重聚之后，寻找并拜访那颗量子卫星，就成了我们氏族共同的目标。这耗费了漫长的时光。许多梦想着能够见到量子卫星的挪麦，在我们发现展开旅程的办法之前就过世了。"
          },
          {
            "speaker": "BELLS",
            "text": "When you reach the Quantum Moon, recall these Nomai, and carry their curiosity onward with you.",
            "parent": 3,
            "zh": "贝尔斯：当你抵达量子卫星时，请铭记这些挪麦，带着所有人的求知欲一起走下去。"
          }
        ]
      },
      {
        "spirals": [
          {
            "speaker": "BELLS",
            "text": "Welcome, Solanum! Your arrival here means you've completed your preparations on Giant's Deep and are ready to depart for the Quantum Moon.",
            "parent": null,
            "zh": "贝尔斯：欢迎，所莱内姆！既然你来到这里，想必是已经在深巨星上做好了准备，要启程去往量子卫星吧。"
          },
          {
            "speaker": "BELLS",
            "text": "On your pilgrimage, the Quantum Moon will carry you, just as it carried me and many in our clan before, to the moon's sixth and most secret location.",
            "parent": 0,
            "zh": "贝尔斯：一旦你踏上朝圣之旅，量子卫星就会载着你——正如过去载着我和族中许多先辈那样——带你前往卫星上第六个、也是最为秘密的地点。"
          },
          {
            "speaker": "BELLS",
            "text": "You'll be aided in your pilgrimage by the shrine our clan built on the Quantum Moon. But remember this final rule: To explore the sixth location, the shrine must be on the moon's north pole.",
            "parent": 1,
            "zh": "贝尔斯：我们氏族建在量子卫星上的祭坛会协助你完成朝圣。但一定要记好这条最后的法则：要想探索第六个位置，祭坛必须位于卫星的北极。"
          },
          {
            "speaker": "BELLS",
            "text": "Be curious on your journey!",
            "parent": 2,
            "zh": "贝尔斯：祝你在旅程中永葆好奇！"
          }
        ]
      }
    ]
  },

  {
    "celestial_body": "Quantum Moon",
    "location": "Sixth Location",
    "conversations": [
      {
        "question_pair": [
          "Me",
          "Quantum Moon"
        ],
        "spirals": [
          {
            "speaker": "SOLANUM",
            "text": "Is this your first time on the Quantum Moon? It’s my first time here.",
            "parent": null,
            "zh": "所莱内姆：你是第一次来到量子卫星吗？我是第一次来。",

            "zh_key": "SOLANUM: Is this your first time on the Quantum Moon? It’s my first time here."

          {
            "speaker": "SOLANUM",
